name: test

# Offline only: no secrets are configured, and @LiveIrsTest classes stay disabled
# unless -Dmef.live.test names one, so this workflow never contacts IRS.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  mvn-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mef-spring-boot-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install SDK jars that are not on Maven Central
        run: ./install-sdk-jars.sh
      - name: Run the offline test suite (same command as local)
        run: mvn -B test

  # The AIR and FTB catalog tests read fixtures from the sibling aca repo and skip here with a
  # reason; everything else, including the redaction and one-owner guards, runs.
  c2s-web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: c2s-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: c2s-web/package-lock.json
      - run: npm ci
      - name: Run the c2s-web tests (same command as local)
        run: npm test
      - name: Build the pages (same command as local)
        run: npx next build
