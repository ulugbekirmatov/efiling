\* Bounds for FilingDesk.tla. check.sh reads this file, sets Mutation, and
\* checks one invariant per TLC run.
SPECIFICATION Spec
CONSTANTS
    Threads = {t1, t2}
    Bodies = {b1, b2}
    MaxRequests = 4
    MaxCrashes = 1
    Mutation = "none"
    NoThread = NoThread
INVARIANTS
    TypeOK
    SameBytesFiledAtMostOnce
    OneLiveReturnPerPeriod
    HeldNeverReleased
    HeldIsJournaled
