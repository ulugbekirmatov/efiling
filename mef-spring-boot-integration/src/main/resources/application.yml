spring:
  application:
    name: mef-spring-boot-integration
  servlet:
    multipart:
      # Byte cap matching ClientFiling.MAX_CLIENT_BODY_CHARS.
      max-request-size: 8000000

server:
  port: 8080
  tomcat:
    # Byte cap matching ClientFiling.MAX_CLIENT_BODY_CHARS.
    max-http-form-post-size: 8000000
  servlet:
    context-path: /api

# MeF Client SDK Configuration
mef:
  # NewSend vertical (com.irs.mef.filing) - write-ahead journal + submit safety
  newsend:
    journal:
      mode: file                             # file (default, durable) | memory (tests only)
      path: data/newsend-journal.jsonl
    session-wait-seconds: 30

  # EFW2 wage files (com.irs.mef.wagefile). A person uploads on BSO; this app only stores the bytes.
  wagefile:
    path: data/wage-files

  # Last-N SendSubmissions document ring (wage PII exception; local only)
  inspector:
    enabled: true
    ring-size: 20          # 1..100
    path: data/inspector-ring
    max-xml-bytes: 1048576

  # IRS acknowledgment retention record, one JSON file per submission id (PII; local only, never evicted)
  ack-store:
    path: data/ack-store

  sdk:
    # Environment: ATS (test) or PRD (production). Endpoint URLs come from the SDK config, not here.
    environment: ATS

    # Client certificate for certificate-only A2A login
    certificate:
      keystore-path: ${MEF_KEYSTORE_PATH:}
      keystore-password: ${MEF_KEYSTORE_PASSWORD:}
      key-alias: ${MEF_KEY_ALIAS:}

    authentication:
      etin: ${MEF_ETIN:}
      asid: ${MEF_ASID:}

# Logging configuration
logging:
  level:
    root: INFO
    com.irs.mef: DEBUG
    gov.irs.mef: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/mef-spring-boot.log
    max-size: 10MB
    max-history: 30

# Actuator endpoints (for health checks and monitoring)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
