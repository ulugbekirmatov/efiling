:root {
  /* Surfaces */
  --ivory:  #FAF9F5;   /* page background */
  --paper:  #FFFFFF;   /* card / surface */
  --g100:   #F0EEE6;
  --g200:   #E6E3DA;
  --g300:   #D1CFC5;
  /* Text */
  --slate:  #141413;   /* primary text */
  --g700:   #3D3D3A;   /* secondary text */
  --g500:   #87867F;   /* muted text */
  /* Accents (Anthropic brand) */
  --clay:   #D97757;   /* primary accent — terracotta */
  --clay-d: #B85C3E;   /* accent hover/active */
  --oat:    #E3DACC;   /* soft accent */
  --olive:  #788C5D;   /* secondary accent */
  /* Typography */
  --serif: ui-serif, Georgia, "Times New Roman", Times, serif;
  --sans:  system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono:  ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;

  --radius-panel:12px; --board-w:2091.0523371063173; --board-h:2451.959734671982;
}
* { box-sizing:border-box; min-width:0; }
body { margin:0; background:var(--ivory); color:var(--slate); font-family:var(--sans); line-height:1.55; overflow-wrap:break-word; }
main { max-width:1180px; margin:0 auto; padding:56px 24px 80px; }
.eyebrow { font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--g500); margin-bottom:12px; display:flex; align-items:center; gap:12px; }
.eyebrow::before { content:""; width:24px; height:1.5px; background:var(--clay); }
h1 { font-family:var(--serif); font-weight:500; font-size:clamp(32px,4.6vw,50px); line-height:1.08; letter-spacing:-.018em; margin:0 0 8px; max-width:24ch; }
.intro { font-size:16.5px; color:var(--g700); margin:18px 0 0; max-width:660px; }
header { margin-bottom:32px; }
code { font-family:var(--mono); font-size:.88em; background:var(--g100); padding:1px 5px; border-radius:4px; white-space:nowrap; }
a { color:var(--clay); text-decoration-color:var(--oat); text-underline-offset:3px; }
.stage { background:var(--paper); border:1.5px solid var(--g200); border-radius:var(--radius-panel); overflow:hidden; }
.viewport { position:relative; aspect-ratio: var(--board-w) / var(--board-h); max-height:70vh; width:100%; overflow:hidden; cursor:pointer;
  background: radial-gradient(circle, #E4E2DA 1px, transparent 1.2px) 0 0 / 22px 22px, #FBFBF9; }
.world { position:absolute; left:0; top:0; width:2091.0523371063173px; height:2451.959734671982px; transform-origin:0 0; transition:transform .75s cubic-bezier(.22,.8,.24,1); }
.layer { position:absolute; opacity:0; transition:opacity .35s ease; pointer-events:none; }
.layer svg { width:100%; height:100%; display:block; overflow:visible; }
.layer.on { opacity:1; }
.layer.on.enter > svg > g { animation: shape-in .45s ease both; }
.layer.past { opacity:.38; }
@keyframes shape-in { from { opacity:0; } to { opacity:1; } }
.caption { display:grid; grid-template-columns: 1fr auto; gap:16px 24px; align-items:center; padding:18px 22px; border-top:1.5px solid var(--g200); }
.caption .k { font-family:var(--mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--clay-d); }
.caption h3 { font-family:var(--serif); font-weight:500; font-size:21px; margin:2px 0 4px; }
.caption p { margin:0; color:var(--g700); max-width:64ch; }
.controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.btn { display:inline-flex; align-items:center; justify-content:center; height:36px; padding:0 14px; font-family:var(--sans); font-size:14px; font-weight:500;
  border-radius:8px; border:1.5px solid var(--g300); background:var(--paper); color:var(--slate); cursor:pointer; transition:background .12s,border-color .12s; }
.btn:hover { background:var(--g100); }
.btn.primary { background:var(--clay); border-color:var(--clay); color:#fff; }
.btn.primary:hover { background:var(--clay-d); border-color:var(--clay-d); }
.btn:disabled { opacity:.4; cursor:default; }
.btn:focus-visible, .dot:focus-visible { outline:2px solid var(--clay); outline-offset:2px; }
.rail { display:flex; gap:6px; padding:0 22px 18px; flex-wrap:wrap; }
.dot { display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--g200); background:var(--paper); color:var(--g500); border-radius:999px;
  padding:4px 12px 4px 4px; font-family:var(--sans); font-size:13px; cursor:pointer; }
.dot span { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--g100); font-family:var(--mono); font-size:11.5px; }
.dot.done { color:var(--g700); }
.dot.done span { background:var(--oat); color:var(--slate); }
.dot.cur { border-color:var(--slate); color:var(--slate); }
.dot.cur span { background:var(--slate); color:#fff; }
.toggles { display:flex; gap:18px; flex-wrap:wrap; padding:0 22px 18px; font-size:13.5px; color:var(--g700); }
.toggles label { display:inline-flex; gap:7px; align-items:center; cursor:pointer; }
.toggles input { accent-color: var(--clay); }
.foot { color:var(--g500); font-size:13.5px; margin:18px 2px 0; }

<script>
(function () {
  var CAP = [{"title":"Every line is 512 bytes, and its first two letters say what it is","body":"File 01 has 7 lines: \u003cstrong>RA RE RW RW RW RT RF\u003c/strong>. A file for several clients repeats RE, its RW lines and RT once per employer."},{"title":"One W-2 is one RW line, at fixed byte positions","body":"Maria's box 1 wages of 52000.00 become 5200000 cents, written \u003ccode>00005200000\u003c/code> at RW 188-198. One byte too many or too few and every field after it moves, so SSA requires exactly 512 bytes."},{"title":"RT adds up the RW lines, RF counts them","body":"52000.00 + 38500.50 + 71250.00 = 161750.50, written \u003ccode>000000016175050\u003c/code> at RT 10-24. SSA checks each RT against the RW lines since the last RE."},{"title":"Each broken test file breaks one rule on purpose","body":"File 94's RT is 100.00 more than its RW lines, file 95's RF says 4 for 3 RW lines, and file 97 has one 511-byte line, which stops testing."}];
  var W = 2091.0523371063173, H = 2451.959734671982, N = CAP.length, HOLD = 2600, MAXZ = 1.3, MARGIN = 320;
  var vp = document.getElementById('vp'), world = document.getElementById('world');
  var layers = [].slice.call(document.querySelectorAll('.layer'));
  var dots = [].slice.call(document.querySelectorAll('.dot'));
  var follow = document.getElementById('follow'), dim = document.getElementById('dim');
  var playBtn = document.getElementById('play'), timer = null, cur = 0;

  // Stagger each shape's fade in the order tldraw drew it.
  layers.forEach(function (l) {
    [].slice.call(l.querySelectorAll(':scope > svg > g')).forEach(function (g, i) { g.style.animationDelay = (i * 70) + 'ms'; });
  });

  function frame(rect) {
    var vw = vp.clientWidth, vh = vp.clientHeight, z, tx, ty;
    if (!rect) {
      z = Math.min(vw / W, vh / H); tx = (vw - W * z) / 2; ty = (vh - H * z) / 2;
    } else {
      z = Math.min(vw / W * MAXZ, vw / (rect.w + MARGIN), vh / (rect.h + MARGIN));
      z = Math.max(z, Math.min(vw / W, vh / H));
      tx = vw / 2 - (rect.x + rect.w / 2) * z; ty = vh / 2 - (rect.y + rect.h / 2) * z;
    }
    world.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + z + ')';
  }
  function rectOf(l) { return { x: l.offsetLeft, y: l.offsetTop, w: l.offsetWidth, h: l.offsetHeight }; }

  function go(n, animate) {
    n = Math.max(1, Math.min(N, n));
    var forward = n > cur;
    layers.forEach(function (l, i) {
      var idx = i + 1;
      l.classList.toggle('on', idx <= n);
      l.classList.toggle('past', dim.checked && idx < n);
      if (idx === n && forward && animate !== false) { l.classList.remove('enter'); void l.offsetWidth; l.classList.add('enter'); }
      else if (idx !== n) l.classList.remove('enter');
    });
    dots.forEach(function (d, i) { d.classList.toggle('cur', i + 1 === n); d.classList.toggle('done', i + 1 < n); });
    cur = n;
    document.getElementById('k').textContent = 'Stage ' + n + ' of ' + N;
    document.getElementById('ct').innerHTML = CAP[n - 1].title;
    document.getElementById('cb').innerHTML = CAP[n - 1].body;
    document.getElementById('prev').disabled = n === 1;
    document.getElementById('next').disabled = n === N;
    frame(follow.checked && n < N ? rectOf(layers[n - 1]) : null);
  }
  function stop() { clearInterval(timer); timer = null; playBtn.textContent = '\u25b6 Play'; }
  function play() {
    if (timer) return stop();
    if (cur === N) go(1);
    playBtn.textContent = '\u275a\u275a Pause';
    timer = setInterval(function () { if (cur >= N) return stop(); go(cur + 1); }, HOLD);
  }

  document.getElementById('prev').onclick = function () { stop(); go(cur - 1); };
  document.getElementById('next').onclick = function () { stop(); go(cur + 1); };
  playBtn.onclick = play;
  vp.onclick = function () { stop(); go(cur === N ? 1 : cur + 1); };
  dots.forEach(function (d) { d.onclick = function () { stop(); go(+d.dataset.i); }; });
  follow.onchange = dim.onchange = function () { go(cur, false); };
  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') { stop(); go(cur + 1); }
    else if (e.key === 'ArrowLeft') { stop(); go(cur - 1); }
    else if (e.key === ' ') { e.preventDefault(); play(); }
  });
